name: Release

on:
  push:
    tags:
      - 'v0.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish verified Go module
    needs: verify
    if: github.repository == 'EveGoodEvening/v-ai-go-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GOTOOLCHAIN: local
      GOSUMDB: sum.golang.org
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare versioned release notes
        id: notes
        run: python3 scripts/prepare-release.py notes "$RELEASE_TAG" "$RUNNER_TEMP/release"

      - name: Install pinned primary Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
          cache: false

      - name: Verify direct and public-proxy consumers
        run: python3 scripts/prepare-release.py verify "$RELEASE_TAG" "$RUNNER_TEMP/release"

      - name: Attest module verification evidence
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/release/release-evidence.json
          create-storage-record: false

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        shell: bash
        run: |
          cp -- "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/release/provenance.sigstore.json"
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release/release-notes.md")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" \
            "$RUNNER_TEMP/release/release-notes.md" \
            "$RUNNER_TEMP/release/release-evidence.json" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            "$RUNNER_TEMP/release/provenance.sigstore.json"
